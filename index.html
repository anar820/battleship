<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battleship — play with a friend</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0b1724; --panel:#12243a; --panel2:#183150; --line:#24476e;
    --sea:#14385c; --sea2:#174268; --ship:#8aa1b8; --hit:#e8553e; --miss:#5f87ad;
    --sunk:#7a1f14; --ok:#3fbf7f; --bad:#d9534f; --text:#e6eef7; --muted:#8fa7c0; --accent:#ffc857;
    --cell: 32px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 0,#163049,#0b1724 60%);color:var(--text);
       font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  #score{color:var(--muted);font-size:14px}
  main{max-width:1150px;margin:0 auto;padding:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
         padding:9px 14px;font:inherit;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);color:#1b1b1b;border-color:var(--accent);font-weight:600}
  select,input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  label{display:flex;gap:8px;align-items:center;margin:8px 0}
  .muted{color:var(--muted)}
  .hidden{display:none!important}

  /* lobby */
  #lobby{max-width:560px;margin:30px auto}
  #lobby h2{margin-top:0}
  .linkrow{display:flex;gap:8px;margin-top:14px}
  .linkrow input{flex:1;min-width:0}
  #lobbyStatus{margin-top:14px}
  .rules-grid label{justify-content:space-between}

  /* game */
  #status{font-size:18px;font-weight:600;text-align:center;padding:12px;border-radius:10px;margin-bottom:16px;background:var(--panel)}
  #status.turn{background:#1f4d2f;border:1px solid var(--ok)}
  #status.wait{background:var(--panel)}
  #status.win{background:#5a4512;border:1px solid var(--accent)}
  #status.lose{background:#4a1a16;border:1px solid var(--bad)}
  .boards{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
  .boardwrap{width:min-content}
  .boardwrap h3{margin:0 0 8px;font-size:15px;text-align:center;color:var(--muted);font-weight:500}
  .board{display:grid;gap:2px;user-select:none;touch-action:manipulation}
  .lbl{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
  .cell{width:var(--cell);height:var(--cell);background:var(--sea);border-radius:3px;position:relative}
  .cell:nth-child(odd){background:var(--sea2)}
  .cell.ship{background:var(--ship)}
  .cell.miss::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--miss)}
  .cell.clear::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#3b5a7a}
  .cell.hit{background:var(--hit)}
  .cell.hit::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
  .cell.sunk{background:var(--sunk)}
  .cell.sunk::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffb3a8}
  .cell.reveal{background:#4d5f72;outline:1px dashed #9fb4c9}
  .cell.pv-ok{background:var(--ok)!important}
  .cell.pv-bad{background:var(--bad)!important}
  .cell.pending{background:var(--accent)!important}
  .board.targeting .cell:not(.hit):not(.miss):not(.sunk):not(.clear){cursor:crosshair}
  .board.targeting .cell:not(.hit):not(.miss):not(.sunk):not(.clear):hover{background:#2c6a9c}
  .board.dim{opacity:.45}
  .board.placing .cell{cursor:pointer}

  .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
  .fleet{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .chip{font-size:12px;padding:4px 8px;border-radius:20px;border:1px solid var(--line);background:var(--bg)}
  .chip.cur{border-color:var(--accent);color:var(--accent)}
  .chip.done{opacity:.4;text-decoration:line-through}
  .chip.sunkchip{background:var(--sunk);border-color:var(--hit)}

  .lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  @media (max-width:760px){.lower{grid-template-columns:1fr}}
  #log{height:200px;overflow:auto;font-size:13px}
  #log div{padding:2px 0;border-bottom:1px solid #1b3350}
  #log .me{color:#9fd3ff}#log .opp{color:#ffcf9f}#log .sys{color:var(--muted)}#log .chat{color:#fff}
  .chatrow{display:flex;gap:6px;margin-top:8px}.chatrow input{flex:1;min-width:0}
  #rulesSummary ul{margin:6px 0 0;padding-left:18px}
  .center{text-align:center}
</style>
</head>
<body>
<header>
  <h1>⚓ <span>Battleship</span> Online</h1>
  <div id="score"></div>
</header>

<main>
  <!-- LOBBY -->
  <section id="lobby" class="card">
    <div id="hostLobby">
      <h2>New game</h2>
      <p class="muted">Pick your rules, copy the invite link, and send it to your friend. The game starts as soon as they open it.</p>
      <div class="rules-grid">
        <label>Board &amp; fleet
          <select id="rPreset"></select></label>
        <label>Shots per turn
          <select id="rShots">
            <option value="1">1 shot</option>
            <option value="2">2 shots</option>
            <option value="3">3 shots</option>
            <option value="salvo">Salvo: 1 per surviving ship</option>
          </select></label>
        <label>Hit = shoot again <input type="checkbox" id="rExtra"></label>
        <label>Ships can't touch (not even diagonally) <input type="checkbox" id="rNoTouch"></label>
        <label>Announce when a ship is sunk <input type="checkbox" id="rReveal" checked></label>
        <label>Who goes first
          <select id="rFirst">
            <option value="random">Random</option>
            <option value="host">Me</option>
            <option value="guest">My friend</option>
          </select></label>
      </div>
      <div class="linkrow">
        <input type="text" id="inviteLink" readonly value="Creating game…">
        <button class="primary" id="copyBtn" disabled>Copy invite link</button>
      </div>
      <div id="lobbyStatus" class="muted">Connecting to matchmaking…</div>
    </div>
    <div id="guestLobby" class="hidden center">
      <h2>Joining game…</h2>
      <div id="guestStatus" class="muted">Connecting to your friend…</div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div id="status">…</div>
    <div class="boards">
      <div class="boardwrap">
        <h3>Your fleet</h3>
        <div id="myBoard" class="board"></div>
        <div id="placeTools">
          <div class="tools">
            <button id="rotateBtn">↻ Rotate (R)</button>
            <button id="randomBtn">🎲 Random</button>
            <button id="clearBtn">Clear</button>
            <button id="readyBtn" class="primary" disabled>Ready</button>
          </div>
          <div id="myFleet" class="fleet"></div>
        </div>
      </div>
      <div class="boardwrap">
        <h3>Enemy waters</h3>
        <div id="enemyBoard" class="board dim"></div>
        <div class="tools" id="fireTools">
          <span id="shotInfo" class="muted"></span>
        </div>
        <div id="enemyFleet" class="fleet"></div>
      </div>
    </div>
    <div class="center hidden" id="overTools" style="margin-top:16px">
      <button class="primary" id="rematchBtn">Play again</button>
    </div>

    <div class="lower">
      <div class="card">
        <strong>Battle log &amp; chat</strong>
        <div id="log"></div>
        <div class="chatrow">
          <input type="text" id="chatInput" placeholder="Say something…" maxlength="200">
          <button id="chatBtn">Send</button>
        </div>
      </div>
      <div class="card" id="rulesSummary"></div>
    </div>
  </section>
</main>

<script>
/* ================== CONFIG ================== */
const PRESETS = {
  classic:{label:'Classic — 10×10, 5 ships', size:10, ships:[['Carrier',5],['Battleship',4],['Cruiser',3],['Submarine',3],['Destroyer',2]]},
  soviet:{label:'Soviet style — 10×10, 10 ships', size:10, ships:[['Battleship',4],['Cruiser',3],['Cruiser',3],['Destroyer',2],['Destroyer',2],['Destroyer',2],['Boat',1],['Boat',1],['Boat',1],['Boat',1]]},
  quick:{label:'Quick — 8×8, 4 ships', size:8, ships:[['Battleship',4],['Cruiser',3],['Submarine',3],['Destroyer',2]]},
  big:{label:'Big — 12×12, 7 ships', size:12, ships:[['Carrier',5],['Battleship',4],['Battleship',4],['Cruiser',3],['Submarine',3],['Destroyer',2],['Destroyer',2]]},
};
const LETTERS = 'ABCDEFGHIJKLMNOP';
const $ = id => document.getElementById(id);

/* ================== STATE ================== */
let peer=null, conn=null, role=null;           // role: 'host' | 'guest'
let rules=null, size=10, fleet=[];
let phase='lobby';                              // lobby | place | battle | over
let ships=[];                                   // {name,len,cells:[[r,c]]|null,hits,sunk}
let curIdx=0, horiz=true, hover=null;
let incoming={}, outgoing={}, enemyReveal={};   // key "r,c"
let enemySunkNames=[];
let myReady=false, oppReady=false, myTurn=false, firstRole='host';
let pending=[], awaiting=false;
let rematchMe=false, rematchOpp=false, lastLoser=null;
let score={me:0,opp:0};

const key=(r,c)=>r+','+c;
const coord=(r,c)=>LETTERS[c]+(r+1);

/* ================== NETWORK ================== */
function send(msg){ if(conn && conn.open) conn.send(msg); }

function start(){
  const joinId = new URLSearchParams(location.search).get('join');
  if(joinId){ role='guest'; startGuest(joinId); }
  else { role='host'; startHost(); }
}

function startHost(){
  fillPresetSelect();
  const id='bship-'+Math.random().toString(36).slice(2,10);
  peer = new Peer(id);
  peer.on('open', id=>{
    const base = location.origin + location.pathname;
    $('inviteLink').value = base + '?join=' + id;
    $('copyBtn').disabled=false;
    $('lobbyStatus').textContent = location.protocol==='file:'
      ? '⚠ You opened this as a local file — the link won\'t work for your friend. Host it online first (see instructions).'
      : 'Waiting for your friend to open the link…';
  });
  peer.on('connection', c=>{
    if(conn && conn.open){ c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)}); return; }
    setupConn(c);
  });
  peer.on('disconnected',()=>{ try{peer.reconnect()}catch(e){} });
  peer.on('error', e=>{
    if(e.type==='unavailable-id'){ location.reload(); return; }
    $('lobbyStatus').textContent='Connection error: '+e.type+'. Try reloading the page.';
  });
}

function startGuest(joinId){
  $('hostLobby').classList.add('hidden'); $('guestLobby').classList.remove('hidden');
  peer = new Peer();
  peer.on('open', ()=>{ setupConn(peer.connect(joinId,{reliable:true})); });
  peer.on('error', e=>{
    $('guestStatus').textContent = e.type==='peer-unavailable'
      ? 'Game not found. Ask your friend to keep their page open and send a fresh link.'
      : 'Connection error: '+e.type+'. Try reloading.';
  });
}

function setupConn(c){
  conn=c;
  c.on('open', ()=>{
    if(role==='host'){
      rules = readRulesForm();
      firstRole = rules.first==='random' ? (Math.random()<.5?'host':'guest') : rules.first;
      send({t:'rules', rules, first:firstRole});
      log('Your friend joined!','sys');
      enterPlacement();
    }
  });
  c.on('data', onData);
  c.on('close', ()=>{ log('Your friend disconnected.','sys'); setStatus('Your friend left the game. Reload to start a new one.','lose'); });
}

function onData(m){
  switch(m.t){
    case 'full': $('guestStatus').textContent='That game already has two players.'; break;
    case 'rules': rules=m.rules; firstRole=m.first; log('Connected to your friend!','sys'); enterPlacement(); break;
    case 'ready': oppReady=true; log('Your friend is ready.','sys'); maybeStartBattle(); updateStatus(); break;
    case 'fire': onFire(m.shots); break;
    case 'result': onResult(m); break;
    case 'reveal': m.ships.forEach(s=>s.forEach(([r,c])=>{ if(!outgoing[key(r,c)]) enemyReveal[key(r,c)]=1; })); renderEnemy(); break;
    case 'chat': log('Friend: '+String(m.text).slice(0,200),'chat'); break;
    case 'rematch': rematchOpp=true; log('Your friend wants a rematch.','sys'); maybeRematch(); break;
  }
}

/* ================== LOBBY ================== */
function fillPresetSelect(){
  const s=$('rPreset');
  for(const [k,p] of Object.entries(PRESETS)){ const o=document.createElement('option'); o.value=k; o.textContent=p.label; s.appendChild(o); }
  s.onchange=()=>{ const sov=s.value==='soviet'; $('rNoTouch').checked=sov; $('rExtra').checked=sov; };
}
function readRulesForm(){
  return { preset:$('rPreset').value, shots:$('rShots').value, extra:$('rExtra').checked,
           noTouch:$('rNoTouch').checked, reveal:$('rReveal').checked, first:$('rFirst').value };
}
$('copyBtn').onclick=async()=>{
  const v=$('inviteLink').value;
  try{ await navigator.clipboard.writeText(v); }
  catch(e){ $('inviteLink').select(); document.execCommand('copy'); }
  $('copyBtn').textContent='Copied ✓'; setTimeout(()=>$('copyBtn').textContent='Copy invite link',1800);
};

/* ================== PLACEMENT ================== */
function enterPlacement(){
  const p=PRESETS[rules.preset]; size=p.size; fleet=p.ships;
  ships=fleet.map(([name,len])=>({name,len,cells:null,hits:0,sunk:false}));
  curIdx=0; horiz=true; hover=null;
  incoming={}; outgoing={}; enemyReveal={}; enemySunkNames=[];
  myReady=false; oppReady=false; pending=[]; awaiting=false; rematchMe=false; rematchOpp=false;
  phase='place';
  document.documentElement.style.setProperty('--cell', `min(32px, calc((100vw - 60px) / ${size+1}))`);
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  $('placeTools').classList.remove('hidden'); $('overTools').classList.add('hidden');
  $('rematchBtn').disabled=false; $('rematchBtn').textContent='Play again';
  buildBoard($('myBoard'), onMyClick, (r,c)=>{hover=[r,c];renderMine();});
  buildBoard($('enemyBoard'), onEnemyClick, null);
  $('myBoard').onmouseleave=()=>{hover=null;renderMine();};
  $('myBoard').oncontextmenu=e=>{ if(phase==='place'){e.preventDefault(); rotate();} };
  renderRules(); renderAll(); updateStatus();
}

function buildBoard(el,onClick,onHover){
  el.innerHTML=''; el.style.gridTemplateColumns=`repeat(${size+1}, var(--cell))`;
  el.appendChild(Object.assign(document.createElement('div'),{className:'lbl'}));
  for(let c=0;c<size;c++) el.appendChild(Object.assign(document.createElement('div'),{className:'lbl',textContent:LETTERS[c]}));
  for(let r=0;r<size;r++){
    el.appendChild(Object.assign(document.createElement('div'),{className:'lbl',textContent:r+1}));
    for(let c=0;c<size;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.r=r; d.dataset.c=c;
      d.onclick=()=>onClick(r,c);
      if(onHover) d.onmouseenter=()=>onHover(r,c);
      el.appendChild(d);
    }
  }
}
const cellsOf=el=>el.querySelectorAll('.cell');

function cellsFor(r,c,len,h){ const a=[]; for(let i=0;i<len;i++) a.push(h?[r,c+i]:[r+i,c]); return a; }
function canPlace(cells, ignore){
  const occ=new Set(), near=new Set();
  ships.forEach((s,i)=>{ if(i===ignore||!s.cells) return;
    s.cells.forEach(([r,c])=>{ occ.add(key(r,c));
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++) near.add(key(r+dr,c+dc)); }); });
  return cells.every(([r,c])=> r>=0&&c>=0&&r<size&&c<size && !occ.has(key(r,c)) && !(rules.noTouch&&near.has(key(r,c))));
}
function shipAt(r,c){ return ships.findIndex(s=>s.cells&&s.cells.some(([a,b])=>a===r&&b===c)); }
function nextUnplaced(){ const i=ships.findIndex(s=>!s.cells); return i; }

function onMyClick(r,c){
  if(phase!=='place'||myReady) return;
  const at=shipAt(r,c);
  if(at>=0){ ships[at].cells=null; curIdx=at; renderAll(); return; }
  if(curIdx<0) return;
  const cells=cellsFor(r,c,ships[curIdx].len,horiz);
  if(!canPlace(cells,curIdx)) return;
  ships[curIdx].cells=cells; curIdx=nextUnplaced(); renderAll();
}
function rotate(){ horiz=!horiz; renderMine(); }
function randomize(){
  for(let attempt=0;attempt<500;attempt++){
    ships.forEach(s=>s.cells=null); let ok=true;
    for(let i=0;i<ships.length&&ok;i++){
      ok=false;
      for(let t=0;t<300;t++){
        const h=Math.random()<.5, r=Math.floor(Math.random()*size), c=Math.floor(Math.random()*size);
        const cells=cellsFor(r,c,ships[i].len,h);
        if(canPlace(cells,i)){ ships[i].cells=cells; ok=true; break; }
      }
    }
    if(ok) break;
  }
  curIdx=nextUnplaced(); renderAll();
}
$('rotateBtn').onclick=rotate;
$('randomBtn').onclick=()=>{ if(!myReady) randomize(); };
$('clearBtn').onclick=()=>{ if(myReady) return; ships.forEach(s=>s.cells=null); curIdx=0; renderAll(); };
$('readyBtn').onclick=()=>{
  if(nextUnplaced()>=0||myReady) return;
  myReady=true; send({t:'ready'}); log('You are ready.','me'); maybeStartBattle(); renderAll(); updateStatus();
};
document.addEventListener('keydown',e=>{ if((e.key==='r'||e.key==='R') && phase==='place' && document.activeElement!==$('chatInput')) rotate(); });

/* ================== BATTLE ================== */
function maybeStartBattle(){
  if(!(myReady&&oppReady)) return;
  phase='battle'; myTurn=(firstRole===role);
  $('placeTools').classList.add('hidden');
  log('Battle begins! '+(myTurn?'You fire first.':'Your friend fires first.'),'sys');
  renderAll(); updateStatus();
}
function shotsAllowed(){
  const n = rules.shots==='salvo' ? ships.filter(s=>!s.sunk).length : +rules.shots;
  let unknown=0; for(let r=0;r<size;r++)for(let c=0;c<size;c++) if(!outgoing[key(r,c)]) unknown++;
  return Math.max(1,Math.min(n,unknown));
}
function onEnemyClick(r,c){
  if(phase!=='battle'||!myTurn||awaiting) return;
  const k=key(r,c); if(outgoing[k]) return;
  const i=pending.findIndex(([a,b])=>a===r&&b===c);
  if(i>=0) pending.splice(i,1); else pending.push([r,c]);
  if(pending.length>=shotsAllowed()){
    awaiting=true; send({t:'fire',shots:pending});
  }
  renderEnemy(); updateStatus();
}
function onFire(shots){
  const results=shots.map(([r,c])=>{
    const k=key(r,c);
    if(incoming[k]) return {r,c,hit:incoming[k]==='hit'};
    const i=shipAt(r,c);
    if(i<0){ incoming[k]='miss'; return {r,c,hit:false}; }
    incoming[k]='hit'; const s=ships[i]; s.hits++;
    let sunk=null;
    if(s.hits===s.len){ s.sunk=true; if(rules.reveal) sunk={name:s.name,cells:s.cells}; }
    return {r,c,hit:true,sunk};
  });
  const lost=ships.every(s=>s.sunk);
  send({t:'result',results,lost});
  results.forEach(x=>log(`Friend fired ${coord(x.r,x.c)} — ${x.hit?(x.sunk?'sunk your '+x.sunk.name+'!':'hit!'):'miss'}`,'opp'));
  applyTurn(results,lost,false);
}
function onResult(m){
  m.results.forEach(x=>{
    outgoing[key(x.r,x.c)] = x.hit?'hit':'miss';
    log(`You fired ${coord(x.r,x.c)} — ${x.hit?(x.sunk?'SUNK their '+x.sunk.name+'!':'HIT!'):'miss'}`,'me');
    if(x.sunk){
      enemySunkNames.push(x.sunk.name);
      x.sunk.cells.forEach(([r,c])=>{
        outgoing[key(r,c)]='sunk';
        if(rules.noTouch) for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const rr=r+dr, cc=c+dc; if(rr>=0&&cc>=0&&rr<size&&cc<size&&!outgoing[key(rr,cc)]) outgoing[key(rr,cc)]='clear';
        }
      });
    }
  });
  pending=[]; awaiting=false;
  applyTurn(m.results,m.lost,true);
}
function applyTurn(results,lost,iShot){
  if(lost){ gameOver(iShot); return; }
  const again = rules.extra && results.some(x=>x.hit);
  myTurn = iShot ? again : !again;
  if(again) log((iShot?'You':'Your friend')+' hit — shoot again!','sys');
  renderAll(); updateStatus();
}
function gameOver(iWon){
  phase='over'; myTurn=false;
  if(iWon) score.me++; else score.opp++;
  lastLoser = iWon ? (role==='host'?'guest':'host') : role;
  send({t:'reveal', ships:ships.filter(s=>!s.sunk).map(s=>s.cells)});
  log(iWon?'🏆 You won!':'💥 Your fleet was sunk.','sys');
  $('overTools').classList.remove('hidden');
  renderAll(); updateStatus();
}
$('rematchBtn').onclick=()=>{
  rematchMe=true; send({t:'rematch'}); $('rematchBtn').disabled=true; $('rematchBtn').textContent='Waiting for friend…'; maybeRematch();
};
function maybeRematch(){
  if(!(rematchMe&&rematchOpp)) return;
  firstRole = lastLoser;              // loser shoots first next game
  log('New game! '+(firstRole===role?'You':'Your friend')+' will fire first.','sys');
  enterPlacement();
}

/* ================== RENDER ================== */
function renderAll(){ renderMine(); renderEnemy(); renderFleets(); $('score').textContent=`You ${score.me} : ${score.opp} Friend`; }
function renderMine(){
  const el=$('myBoard'); el.classList.toggle('placing',phase==='place'&&!myReady);
  const own={}; ships.forEach(s=>s.cells&&s.cells.forEach(([r,c])=>own[key(r,c)]=s));
  let pv=null, pvOk=false;
  if(phase==='place'&&!myReady&&hover&&curIdx>=0){
    pv=new Set(cellsFor(hover[0],hover[1],ships[curIdx].len,horiz).map(([r,c])=>key(r,c)));
    pvOk=canPlace(cellsFor(hover[0],hover[1],ships[curIdx].len,horiz),curIdx);
  }
  cellsOf(el).forEach(d=>{
    const k=key(+d.dataset.r,+d.dataset.c), s=own[k], inc=incoming[k];
    d.className='cell';
    if(s) d.classList.add(s.sunk?'sunk':(inc==='hit'?'hit':'ship'));
    else if(inc==='miss') d.classList.add('miss');
    if(pv&&pv.has(k)) d.classList.add(pvOk?'pv-ok':'pv-bad');
  });
  $('readyBtn').disabled = myReady || nextUnplaced()>=0;
}
function renderEnemy(){
  const el=$('enemyBoard');
  el.classList.toggle('dim', phase==='place');
  el.classList.toggle('targeting', phase==='battle'&&myTurn&&!awaiting);
  const pend=new Set(pending.map(([r,c])=>key(r,c)));
  cellsOf(el).forEach(d=>{
    const k=key(+d.dataset.r,+d.dataset.c), o=outgoing[k];
    d.className='cell';
    if(o) d.classList.add(o); else if(enemyReveal[k]) d.classList.add('reveal');
    if(pend.has(k)) d.classList.add('pending');
  });
  $('shotInfo').textContent = phase==='battle'&&myTurn&&shotsAllowed()>1
    ? `Pick ${shotsAllowed()} targets (${pending.length}/${shotsAllowed()} chosen) — fires automatically` : '';
}
function renderFleets(){
  $('myFleet').innerHTML = ships.map((s,i)=>`<span class="chip ${i===curIdx&&!myReady?'cur':''} ${s.cells?'done':''}">${s.name} (${s.len})</span>`).join('');
  if(rules.reveal){
    const left=[...enemySunkNames];
    $('enemyFleet').innerHTML = fleet.map(([n,l])=>{
      const j=left.indexOf(n); const sunk=j>=0; if(sunk) left.splice(j,1);
      return `<span class="chip ${sunk?'sunkchip':''}">${n} (${l})${sunk?' ☠':''}</span>`; }).join('');
  } else $('enemyFleet').innerHTML='<span class="muted" style="font-size:12px">Sinkings are secret in this game.</span>';
}
function setStatus(text,cls){ const s=$('status'); s.textContent=text; s.className=cls||''; }
function updateStatus(){
  if(phase==='place'){
    if(!myReady) setStatus(nextUnplaced()>=0 ? `Place your ${ships[curIdx].name} (${ships[curIdx].len}) — click your board. Right-click or R to rotate.` : 'All ships placed — press Ready!','wait');
    else setStatus(oppReady?'Starting…':'Waiting for your friend to place their ships…','wait');
  } else if(phase==='battle'){
    if(awaiting) setStatus('Firing…','wait');
    else if(myTurn) setStatus('🎯 Your turn — fire at enemy waters!','turn');
    else setStatus('Your friend is aiming…','wait');
  } else if(phase==='over'){
    const won = lastLoser!==role;
    setStatus(won?'🏆 Victory! You sank their whole fleet.':'💥 Defeat — your fleet is gone.', won?'win':'lose');
  }
}
function renderRules(){
  const p=PRESETS[rules.preset];
  const shots = rules.shots==='salvo'?'Salvo — one shot per surviving ship':`${rules.shots} shot${rules.shots==='1'?'':'s'} per turn`;
  $('rulesSummary').innerHTML = `<strong>Rules this game</strong><ul>
    <li>${p.label}</li><li>${shots}</li>
    <li>${rules.extra?'A hit earns another turn':'Turns alternate every volley'}</li>
    <li>${rules.noTouch?'Ships may not touch, even diagonally':'Ships may touch'}</li>
    <li>${rules.reveal?'Sunk ships are announced':'Sinkings are kept secret'}</li></ul>`;
}
function log(text,cls){
  const d=document.createElement('div'); d.className=cls; d.textContent=text;
  const l=$('log'); l.appendChild(d); l.scrollTop=l.scrollHeight;
}
function sendChat(){
  const v=$('chatInput').value.trim(); if(!v||!conn) return;
  send({t:'chat',text:v}); log('You: '+v,'chat'); $('chatInput').value='';
}
$('chatBtn').onclick=sendChat;
$('chatInput').addEventListener('keydown',e=>{ if(e.key==='Enter') sendChat(); });

if(typeof Peer==='undefined'){
  document.body.innerHTML='<p style="padding:30px">Could not load the networking library. Check your internet connection and reload.</p>';
} else start();
</script>
</body>
</html>
